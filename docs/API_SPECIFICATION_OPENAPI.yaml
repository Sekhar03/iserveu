openapi: 3.0.3
info:
  title: Saraswat Bank Digital Payments Reconciliation Platform API
  description: |
    REST API for the Digital Payments Reconciliation Platform.
    
    This API provides endpoints for:
    - Dispute and chargeback management
    - ODR (Online Dispute Resolution) integration for bank website
    - Mobile banking API integration
    - Reconciliation operations
    - TTUM generation and management
    - GL balancing and reporting
    
    **Authentication:**
    - API Key authentication for external integrations (ODR, Mobile)
    - OAuth2/JWT for internal web application
    - Maker-checker enforcement for critical operations
    
    **Rate Limiting:**
    - 1000 requests per minute per API key
    - Burst rate: 100 requests per 10 seconds
    
    **Idempotency:**
    - All POST/PUT requests support idempotency via `Idempotency-Key` header
  version: 1.0.0
  contact:
    name: Saraswat Co-operative Bank Ltd.
    email: support@saraswatbank.com
  license:
    name: Proprietary
    url: https://www.saraswatbank.com

servers:
  - url: https://api.recon.saraswatbank.com/v1
    description: Production server
  - url: https://api-staging.recon.saraswatbank.com/v1
    description: Staging server
  - url: http://localhost:8080/v1
    description: Development server

security:
  - ApiKeyAuth: []
  - OAuth2: []

tags:
  - name: Disputes
    description: Dispute and chargeback management operations
  - name: ODR
    description: Online Dispute Resolution integration for bank website
  - name: Mobile
    description: Mobile banking API integration
  - name: Reconciliation
    description: Reconciliation operations
  - name: TTUM
    description: TTUM generation and management
  - name: GL
    description: GL balancing operations
  - name: Reports
    description: Reporting and MIS operations

paths:
  # ============================================================================
  # DISPUTE MANAGEMENT ENDPOINTS
  # ============================================================================

  /disputes:
    get:
      tags:
        - Disputes
      summary: List disputes
      description: Retrieve a paginated list of disputes with optional filters
      parameters:
        - name: page
          in: query
          description: Page number (1-based)
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          description: Number of items per page
          schema:
            type: integer
            default: 50
            maximum: 100
        - name: product
          in: query
          description: Filter by product type
          schema:
            type: string
            enum: [UPI, IMPS, AEPS, BBPS, NETC, PAYMENT_GATEWAY, RUPAY, VISA, NFS_ISSUER, NFS_ACQUIRER, GIFT_CARD]
        - name: status
          in: query
          description: Filter by dispute status
          schema:
            type: string
            enum: [RAISED, VALIDATED, FILED, ACCEPTED, REJECTED, PRE_ARBITRATION, ARBITRATION, CLOSED, WITHDRAWN]
        - name: rrn
          in: query
          description: Filter by RRN
          schema:
            type: string
        - name: branch_code
          in: query
          description: Filter by branch code
          schema:
            type: string
        - name: from_date
          in: query
          description: Filter by raised date (from)
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          description: Filter by raised date (to)
          schema:
            type: string
            format: date
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      disputes:
                        type: array
                        items:
                          $ref: '#/components/schemas/Dispute'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Disputes
      summary: Create a new dispute
      description: Create a new dispute case. Requires maker-checker approval.
      parameters:
        - name: Idempotency-Key
          in: header
          description: Idempotency key for duplicate prevention
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeCreateRequest'
      responses:
        '201':
          description: Dispute created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Dispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Duplicate dispute for same RRN
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /disputes/{disputeId}:
    get:
      tags:
        - Disputes
      summary: Get dispute details
      description: Retrieve detailed information about a specific dispute
      parameters:
        - name: disputeId
          in: path
          required: true
          description: Dispute UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DisputeDetail'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    put:
      tags:
        - Disputes
      summary: Update dispute
      description: Update dispute details. Requires maker-checker approval.
      parameters:
        - name: disputeId
          in: path
          required: true
          description: Dispute UUID
          schema:
            type: string
            format: uuid
        - name: Idempotency-Key
          in: header
          description: Idempotency key for duplicate prevention
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DisputeUpdateRequest'
      responses:
        '200':
          description: Dispute updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/Dispute'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    delete:
      tags:
        - Disputes
      summary: Withdraw dispute
      description: Withdraw a dispute (only if in RAISED status)
      parameters:
        - name: disputeId
          in: path
          required: true
          description: Dispute UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Dispute withdrawn successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Dispute withdrawn successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /disputes/{disputeId}/history:
    get:
      tags:
        - Disputes
      summary: Get dispute history
      description: Retrieve the history of status changes for a dispute
      parameters:
        - name: disputeId
          in: path
          required: true
          description: Dispute UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisputeHistory'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /disputes/{disputeId}/documents:
    get:
      tags:
        - Disputes
      summary: List dispute documents
      description: Retrieve list of documents attached to a dispute
      parameters:
        - name: disputeId
          in: path
          required: true
          description: Dispute UUID
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/DisputeDocument'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

    post:
      tags:
        - Disputes
      summary: Upload dispute document
      description: Upload a document to a dispute
      parameters:
        - name: disputeId
          in: path
          required: true
          description: Dispute UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, JPG, PNG, max 10MB)
                document_type:
                  type: string
                  description: Document type
                  enum: [EVIDENCE, SCREENSHOT, RECEIPT, ID_PROOF, OTHER]
                description:
                  type: string
                  description: Document description
              required:
                - file
                - document_type
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/DisputeDocument'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /disputes/{disputeId}/submit-npci:
    post:
      tags:
        - Disputes
      summary: Submit dispute to NPCI
      description: Submit dispute to NPCI for processing (API or portal-assisted)
      parameters:
        - name: disputeId
          in: path
          required: true
          description: Dispute UUID
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                submission_method:
                  type: string
                  enum: [API, PORTAL_ASSISTED]
                  description: Submission method
                evidence_package:
                  type: string
                  description: Path to evidence package (for portal-assisted)
              required:
                - submission_method
      responses:
        '200':
          description: Dispute submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      npci_reference:
                        type: string
                        description: NPCI reference number
                      submission_id:
                        type: string
                        format: uuid
                        description: Submission UUID
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # ODR (ONLINE DISPUTE RESOLUTION) ENDPOINTS
  # ============================================================================

  /odr/disputes:
    post:
      tags:
        - ODR
      summary: Create ODR dispute (customer-facing)
      description: |
        Create a dispute through the bank's website ODR integration.
        This endpoint is designed for customer-initiated disputes.
        
        **Authentication:** API Key required
        **Rate Limiting:** 100 requests per minute per API key
        **Idempotency:** Supported via Idempotency-Key header
      parameters:
        - name: Idempotency-Key
          in: header
          description: Idempotency key for duplicate prevention
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ODRDisputeCreateRequest'
      responses:
        '201':
          description: Dispute created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      dispute_id:
                        type: string
                        format: uuid
                      reference_number:
                        type: string
                        description: Customer-facing reference number
                      status:
                        type: string
                        enum: [RAISED, VALIDATED]
                      message:
                        type: string
                        example: Dispute created successfully. Reference: REF123456
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Duplicate dispute for same transaction
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /odr/disputes/{referenceNumber}:
    get:
      tags:
        - ODR
      summary: Get ODR dispute status
      description: Retrieve the status of an ODR dispute by reference number
      parameters:
        - name: referenceNumber
          in: path
          required: true
          description: Customer-facing reference number
          schema:
            type: string
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ODRDisputeStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /odr/disputes/{referenceNumber}/documents:
    post:
      tags:
        - ODR
      summary: Upload ODR dispute document
      description: Upload a document to an ODR dispute
      parameters:
        - name: referenceNumber
          in: path
          required: true
          description: Customer-facing reference number
          schema:
            type: string
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, JPG, PNG, max 5MB)
                document_type:
                  type: string
                  enum: [EVIDENCE, SCREENSHOT, RECEIPT, ID_PROOF, OTHER]
                description:
                  type: string
              required:
                - file
                - document_type
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      document_id:
                        type: string
                        format: uuid
                      message:
                        type: string
                        example: Document uploaded successfully
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # MOBILE BANKING API ENDPOINTS
  # ============================================================================

  /mobile/disputes:
    post:
      tags:
        - Mobile
      summary: Create mobile dispute
      description: |
        Create a dispute through the mobile banking app.
        
        **Authentication:** OAuth2/JWT required
        **Rate Limiting:** 50 requests per minute per user
        **Idempotency:** Supported via Idempotency-Key header
      parameters:
        - name: Idempotency-Key
          in: header
          description: Idempotency key for duplicate prevention
          schema:
            type: string
          required: false
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MobileDisputeCreateRequest'
      responses:
        '201':
          description: Dispute created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      dispute_id:
                        type: string
                        format: uuid
                      reference_number:
                        type: string
                      status:
                        type: string
                      estimated_resolution_date:
                        type: string
                        format: date
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Duplicate dispute
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mobile/disputes:
    get:
      tags:
        - Mobile
      summary: List user disputes
      description: Retrieve list of disputes for the authenticated user
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
            maximum: 50
        - name: status
          in: query
          schema:
            type: string
            enum: [RAISED, VALIDATED, FILED, ACCEPTED, REJECTED, CLOSED]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      disputes:
                        type: array
                        items:
                          $ref: '#/components/schemas/MobileDisputeSummary'
                      pagination:
                        $ref: '#/components/schemas/Pagination'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mobile/disputes/{disputeId}:
    get:
      tags:
        - Mobile
      summary: Get mobile dispute details
      description: Retrieve details of a specific dispute for the authenticated user
      parameters:
        - name: disputeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/MobileDisputeDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /mobile/disputes/{disputeId}/documents:
    post:
      tags:
        - Mobile
      summary: Upload mobile dispute document
      description: Upload a document to a mobile dispute
      parameters:
        - name: disputeId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: Document file (PDF, JPG, PNG, max 5MB)
                document_type:
                  type: string
                  enum: [EVIDENCE, SCREENSHOT, RECEIPT, ID_PROOF, OTHER]
              required:
                - file
                - document_type
      responses:
        '201':
          description: Document uploaded successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      document_id:
                        type: string
                        format: uuid
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # RECONCILIATION ENDPOINTS
  # ============================================================================

  /reconciliation/run:
    post:
      tags:
        - Reconciliation
      summary: Run reconciliation
      description: Trigger reconciliation for a product, date, and cycle
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: string
                  enum: [UPI, IMPS, AEPS, BBPS, NETC, PAYMENT_GATEWAY, RUPAY, VISA, NFS_ISSUER, NFS_ACQUIRER, GIFT_CARD]
                business_date:
                  type: string
                  format: date
                cycle_no:
                  type: integer
                  description: Cycle number (null for consolidated batch)
                side:
                  type: string
                  enum: [REMITTER, BENEFICIARY, ISSUER, ACQUIRER]
              required:
                - product
                - business_date
      responses:
        '200':
          description: Reconciliation initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      job_id:
                        type: string
                        format: uuid
                      status:
                        type: string
                        enum: [INITIATED, RUNNING]
                      message:
                        type: string
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reconciliation/jobs/{jobId}:
    get:
      tags:
        - Reconciliation
      summary: Get reconciliation job status
      description: Retrieve the status of a reconciliation job
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/ReconJobStatus'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /reconciliation/summary:
    get:
      tags:
        - Reconciliation
      summary: Get reconciliation summary
      description: Retrieve reconciliation summary for a product and date range
      parameters:
        - name: product
          in: query
          required: true
          schema:
            type: string
            enum: [UPI, IMPS, AEPS, BBPS, NETC, PAYMENT_GATEWAY, RUPAY, VISA, NFS_ISSUER, NFS_ACQUIRER, GIFT_CARD]
        - name: from_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: to_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: side
          in: query
          schema:
            type: string
            enum: [REMITTER, BENEFICIARY, ISSUER, ACQUIRER]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ReconSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # TTUM ENDPOINTS
  # ============================================================================

  /ttum/generate:
    post:
      tags:
        - TTUM
      summary: Generate TTUM for exception
      description: Generate TTUM for a single exception
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                exception_id:
                  type: string
                  format: uuid
                maker:
                  type: string
                  description: Maker username
              required:
                - exception_id
                - maker
      responses:
        '200':
          description: TTUM generated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/TtumBatch'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ttum/batch/{batchId}/submit:
    post:
      tags:
        - TTUM
      summary: Submit TTUM batch for approval
      description: Submit TTUM batch for checker approval (maker action)
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maker:
                  type: string
                  description: Maker username
              required:
                - maker
      responses:
        '200':
          description: Batch submitted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Batch submitted for approval
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ttum/batch/{batchId}/approve:
    post:
      tags:
        - TTUM
      summary: Approve TTUM batch
      description: Approve TTUM batch (checker action)
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                checker:
                  type: string
                  description: Checker username
              required:
                - checker
      responses:
        '200':
          description: Batch approved successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: object
                    properties:
                      export_file_path:
                        type: string
                      message:
                        type: string
                        example: Batch approved and CBS export generated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /ttum/batch/{batchId}/upload:
    post:
      tags:
        - TTUM
      summary: Upload TTUM to CBS
      description: Upload approved TTUM batch to CBS
      parameters:
        - name: batchId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Upload initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: Upload initiated
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # GL BALANCING ENDPOINTS
  # ============================================================================

  /gl/balance:
    get:
      tags:
        - GL
      summary: Get GL balance
      description: Retrieve GL balance for a product and date
      parameters:
        - name: product
          in: query
          required: true
          schema:
            type: string
            enum: [UPI, IMPS, AEPS, BBPS, NETC, PAYMENT_GATEWAY, RUPAY, VISA, NFS_ISSUER, NFS_ACQUIRER, GIFT_CARD]
        - name: business_date
          in: query
          required: true
          schema:
            type: string
            format: date
        - name: gl_type
          in: query
          schema:
            type: string
            enum: [SETTLEMENT, SUSPENSE, CHARGEBACK, FOREX, COMPENSATION, ATM_CASH]
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/GlBalanceDaily'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gl/calculate:
    post:
      tags:
        - GL
      summary: Calculate GL balance
      description: Trigger GL balance calculation for a product and date
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                product:
                  type: string
                  enum: [UPI, IMPS, AEPS, BBPS, NETC, PAYMENT_GATEWAY, RUPAY, VISA, NFS_ISSUER, NFS_ACQUIRER, GIFT_CARD]
                business_date:
                  type: string
                  format: date
              required:
                - product
                - business_date
      responses:
        '200':
          description: Calculation initiated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: GL balance calculation initiated
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /gl/balance/{balanceId}/approve:
    post:
      tags:
        - GL
      summary: Approve GL balance
      description: Approve GL balance (day close)
      parameters:
        - name: balanceId
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                approver:
                  type: string
                  description: Approver username
              required:
                - approver
      responses:
        '200':
          description: Approval successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  message:
                    type: string
                    example: GL balance approved
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ============================================================================
  # COMPONENTS (SCHEMAS)
  # ============================================================================

components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API key for external integrations (ODR, Mobile)
    OAuth2:
      type: oauth2
      flows:
        authorizationCode:
          authorizationUrl: https://auth.saraswatbank.com/oauth/authorize
          tokenUrl: https://auth.saraswatbank.com/oauth/token
          scopes:
            read: Read access
            write: Write access
            admin: Admin access

  schemas:
    Dispute:
      type: object
      properties:
        dispute_id:
          type: string
          format: uuid
        product:
          type: string
          enum: [UPI, IMPS, AEPS, BBPS, NETC, PAYMENT_GATEWAY, RUPAY, VISA, NFS_ISSUER, NFS_ACQUIRER, GIFT_CARD]
        rrn:
          type: string
        amount:
          type: number
          format: decimal
        dispute_type:
          type: string
          enum: [CHARGEBACK, PRE_ARBITRATION, ODR, REFUND, OTHER]
        dispute_reason:
          type: string
        status:
          type: string
          enum: [RAISED, VALIDATED, FILED, ACCEPTED, REJECTED, PRE_ARBITRATION, ARBITRATION, CLOSED, WITHDRAWN]
        raised_by:
          type: string
        raised_at:
          type: string
          format: date-time
        tat_deadline:
          type: string
          format: date-time
        branch_code:
          type: string
        branch_name:
          type: string

    DisputeDetail:
      allOf:
        - $ref: '#/components/schemas/Dispute'
        - type: object
          properties:
            customer_name:
              type: string
            customer_account:
              type: string
            customer_contact:
              type: string
            customer_email:
              type: string
            txn_id:
              type: string
              format: uuid
            npci_reference:
              type: string
            resolution:
              type: string
            resolution_amount:
              type: number
              format: decimal
            resolved_at:
              type: string
              format: date-time
            resolved_by:
              type: string
            documents:
              type: array
              items:
                $ref: '#/components/schemas/DisputeDocument'
            history:
              type: array
              items:
                $ref: '#/components/schemas/DisputeHistory'

    DisputeCreateRequest:
      type: object
      required:
        - product
        - rrn
        - dispute_type
        - dispute_reason
        - raised_by
      properties:
        product:
          type: string
          enum: [UPI, IMPS, AEPS, BBPS, NETC, PAYMENT_GATEWAY, RUPAY, VISA, NFS_ISSUER, NFS_ACQUIRER, GIFT_CARD]
        rrn:
          type: string
          description: RRN or transaction reference
        amount:
          type: number
          format: decimal
          description: Disputed amount (optional, auto-populated from recon if not provided)
        dispute_type:
          type: string
          enum: [CHARGEBACK, PRE_ARBITRATION, ODR, REFUND, OTHER]
        dispute_category:
          type: string
        dispute_reason:
          type: string
          description: Detailed reason for dispute
        customer_name:
          type: string
        customer_account:
          type: string
        customer_contact:
          type: string
        customer_email:
          type: string
        branch_code:
          type: string
        branch_name:
          type: string
        raised_by:
          type: string
          description: Username of person raising dispute

    DisputeUpdateRequest:
      type: object
      properties:
        dispute_type:
          type: string
          enum: [CHARGEBACK, PRE_ARBITRATION, ODR, REFUND, OTHER]
        dispute_reason:
          type: string
        customer_name:
          type: string
        customer_contact:
          type: string
        customer_email:
          type: string
        notes:
          type: string

    DisputeHistory:
      type: object
      properties:
        id:
          type: integer
        dispute_id:
          type: string
          format: uuid
        old_status:
          type: string
        new_status:
          type: string
        action:
          type: string
        action_notes:
          type: string
        performed_by:
          type: string
        performed_at:
          type: string
          format: date-time
        document_count:
          type: integer

    DisputeDocument:
      type: object
      properties:
        document_id:
          type: string
          format: uuid
        dispute_id:
          type: string
          format: uuid
        document_type:
          type: string
          enum: [EVIDENCE, SCREENSHOT, RECEIPT, ID_PROOF, OTHER]
        document_name:
          type: string
        document_path:
          type: string
        document_size:
          type: integer
        document_format:
          type: string
        uploaded_by:
          type: string
        uploaded_at:
          type: string
          format: date-time
        description:
          type: string

    ODRDisputeCreateRequest:
      type: object
      required:
        - customer_account
        - rrn
        - dispute_reason
      properties:
        customer_account:
          type: string
          description: Customer account number
        rrn:
          type: string
          description: Transaction RRN or reference
        amount:
          type: number
          format: decimal
        dispute_reason:
          type: string
          description: Reason for dispute
        customer_name:
          type: string
        customer_contact:
          type: string
        customer_email:
          type: string
        document_attachments:
          type: array
          items:
            type: string
            format: binary

    ODRDisputeStatus:
      type: object
      properties:
        reference_number:
          type: string
        status:
          type: string
          enum: [RAISED, VALIDATED, FILED, ACCEPTED, REJECTED, CLOSED]
        raised_at:
          type: string
          format: date-time
        estimated_resolution_date:
          type: string
          format: date
        current_stage:
          type: string
        message:
          type: string

    MobileDisputeCreateRequest:
      type: object
      required:
        - rrn
        - dispute_reason
      properties:
        rrn:
          type: string
        amount:
          type: number
          format: decimal
        dispute_reason:
          type: string
        dispute_category:
          type: string
        notes:
          type: string

    MobileDisputeSummary:
      type: object
      properties:
        dispute_id:
          type: string
          format: uuid
        reference_number:
          type: string
        rrn:
          type: string
        amount:
          type: number
          format: decimal
        status:
          type: string
        raised_at:
          type: string
          format: date-time
        estimated_resolution_date:
          type: string
          format: date

    MobileDisputeDetail:
      allOf:
        - $ref: '#/components/schemas/MobileDisputeSummary'
        - type: object
          properties:
            dispute_reason:
              type: string
            resolution:
              type: string
            resolution_amount:
              type: number
              format: decimal
            documents:
              type: array
              items:
                $ref: '#/components/schemas/DisputeDocument'
            history:
              type: array
              items:
                $ref: '#/components/schemas/DisputeHistory'

    ReconJobStatus:
      type: object
      properties:
        job_id:
          type: string
          format: uuid
        product:
          type: string
        business_date:
          type: string
          format: date
        cycle_no:
          type: integer
        status:
          type: string
          enum: [INITIATED, RUNNING, COMPLETED, FAILED]
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        error_message:
          type: string
        progress:
          type: integer
          description: Progress percentage (0-100)

    ReconSummary:
      type: object
      properties:
        product:
          type: string
        side:
          type: string
        business_date:
          type: string
          format: date
        cycle_no:
          type: integer
        total_cbs_records:
          type: integer
        total_switch_records:
          type: integer
        total_network_records:
          type: integer
        matched_count:
          type: integer
        unmatched_count:
          type: integer
        partial_match_count:
          type: integer
        matched_amount:
          type: number
          format: decimal
        unmatched_amount:
          type: number
          format: decimal
        match_percentage:
          type: number
          format: decimal

    TtumBatch:
      type: object
      properties:
        batch_id:
          type: string
          format: uuid
        product:
          type: string
        business_date:
          type: string
          format: date
        batch_name:
          type: string
        status:
          type: string
          enum: [DRAFT, SUBMITTED, APPROVED, GENERATED, UPLOADED, POSTED, FAILED]
        record_count:
          type: integer
        dr_total:
          type: number
          format: decimal
        cr_total:
          type: number
          format: decimal
        maker:
          type: string
        maker_at:
          type: string
          format: date-time
        checker:
          type: string
        checker_at:
          type: string
          format: date-time
        export_file_path:
          type: string
        generated_at:
          type: string
          format: date-time
        uploaded_at:
          type: string
          format: date-time

    GlBalanceDaily:
      type: object
      properties:
        id:
          type: integer
        product:
          type: string
        gl_account:
          type: string
        gl_type:
          type: string
        business_date:
          type: string
          format: date
        branch_code:
          type: string
        opening_balance:
          type: number
          format: decimal
        dr_amount:
          type: number
          format: decimal
        cr_amount:
          type: number
          format: decimal
        closing_balance:
          type: number
          format: decimal
        expected_closing_balance:
          type: number
          format: decimal
        difference_amount:
          type: number
          format: decimal
        matched_amount:
          type: number
          format: decimal
        ttum_posted_amount:
          type: number
          format: decimal
        ttum_pending_amount:
          type: number
          format: decimal
        suspense_amount:
          type: number
          format: decimal
        status:
          type: string
          enum: [PENDING, APPROVED, LOCKED]

    Pagination:
      type: object
      properties:
        page:
          type: integer
        limit:
          type: integer
        total:
          type: integer
        total_pages:
          type: integer

    Error:
      type: object
      properties:
        success:
          type: boolean
          example: false
        error:
          type: object
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: object

  responses:
    BadRequest:
      description: Bad request
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: BAD_REQUEST
              message: Invalid request parameters
              details:
                field: "rrn"
                reason: "RRN is required"

    Unauthorized:
      description: Unauthorized
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: UNAUTHORIZED
              message: Invalid or missing API key

    NotFound:
      description: Resource not found
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: NOT_FOUND
              message: Dispute not found

    TooManyRequests:
      description: Rate limit exceeded
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: TOO_MANY_REQUESTS
              message: Rate limit exceeded. Please try again later.

    InternalServerError:
      description: Internal server error
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            success: false
            error:
              code: INTERNAL_SERVER_ERROR
              message: An unexpected error occurred
