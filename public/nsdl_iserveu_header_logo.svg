<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 70" fill="none">
  <defs>
    <!-- Rich Metallic Golden Amber Gradient -->
    <linearGradient id="hdr-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C57E18"/>
      <stop offset="25%" stop-color="#DE9622"/>
      <stop offset="55%" stop-color="#F5C74F"/>
      <stop offset="85%" stop-color="#EAA628"/>
      <stop offset="100%" stop-color="#C67D16"/>
    </linearGradient>

    <!-- Deep Maroon / Wine Red Gradient for Under-Loop -->
    <linearGradient id="hdr-maroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#552228"/>
      <stop offset="35%" stop-color="#6E2830"/>
      <stop offset="70%" stop-color="#84323B"/>
      <stop offset="100%" stop-color="#60252C"/>
    </linearGradient>

    <!-- Center Fold Highlight -->
    <linearGradient id="hdr-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8D36A"/>
      <stop offset="100%" stop-color="#D6891E"/>
    </linearGradient>
  </defs>

  <!-- NSDL Dual-Swirl Ribbon Emblem -->
  <g id="nsdl-emblem" transform="translate(4, 8) scale(0.28)">
    <!-- Dark Maroon / Burgundy Crescent Arm (Left & Lower) -->
    <path d="M 105 105 
             C 118 118, 126 138, 122 152 
             C 116 174, 92 195, 62 190 
             C 32 185, 10 156, 8 126 
             C 6 96, 22 68, 48 52 
             C 62 43, 76 42, 85 45 
             L 76 66 
             C 68 64, 56 66, 46 74 
             C 30 87, 26 112, 33 130 
             C 41 150, 62 165, 82 160 
             C 96 156, 104 142, 102 128 
             C 101 120, 96 114, 90 110 
             Z" 
          fill="url(#hdr-maroon)"/>

    <!-- Rich Golden Amber Crescent Arm (Right & Upper) -->
    <path d="M 95 95 
             C 82 82, 74 62, 78 48 
             C 84 26, 108 5, 138 10 
             C 168 15, 190 44, 192 74 
             C 194 104, 178 132, 152 148 
             C 138 157, 124 158, 115 155 
             L 124 134 
             C 132 136, 144 134, 154 126 
             C 170 113, 174 88, 167 70 
             C 159 50, 138 35, 118 40 
             C 104 44, 96 58, 98 72 
             C 99 80, 104 86, 110 90 
             Z" 
          fill="url(#hdr-gold)"/>

    <!-- Center Interlocking Sharp Fold Rhombus Highlight -->
    <polygon points="98,90 115,74 108,102 91,118" fill="url(#hdr-fold)"/>
    <polygon points="102,110 85,126 92,98 109,82" fill="#5A2228" opacity="0.85"/>
  </g>

  <!-- NSDL Payments Bank Typography -->
  <g transform="translate(68, 47)">
    <!-- NSDL in Serif -->
    <text x="0" y="0" font-family="'Playfair Display', 'Bodoni MT', 'Georgia', 'Times New Roman', serif" font-size="34" font-weight="900" fill="#801824" letter-spacing="0.5">NSDL</text>
    <!-- Payments Bank in Bold Compact Sans-Serif -->
    <text x="110" y="0" font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', 'Segoe UI', sans-serif" font-size="30" font-weight="900" fill="#801824" letter-spacing="-0.5">Payments Bank</text>
  </g>

  <!-- Vertical Divider Bar -->
  <line x1="472" y1="12" x2="472" y2="58" stroke="#CBD5E1" stroke-width="2.5" stroke-linecap="round"/>

  <!-- iServeU Wordmark with Trademark -->
  <g transform="translate(492, 47)">
    <text x="0" y="0" font-family="'Poppins', 'Inter', 'Segoe UI', sans-serif" font-size="35" font-weight="800" fill="#00A8B5" letter-spacing="-0.8">iServeU</text>
    <!-- Registered Symbol ® -->
    <circle cx="140" cy="-22" r="8" stroke="#00A8B5" stroke-width="2" fill="none"/>
    <text x="136.8" y="-18" font-family="'Inter', sans-serif" font-size="9.5" font-weight="800" fill="#00A8B5">®</text>
  </g>
</svg>
