<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1150 250" fill="none">
  <defs>
    <!-- Metallic Golden Amber Gradient -->
    <linearGradient id="stk-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#C57E18"/>
      <stop offset="25%" stop-color="#DE9622"/>
      <stop offset="55%" stop-color="#F5C74F"/>
      <stop offset="85%" stop-color="#EAA628"/>
      <stop offset="100%" stop-color="#C67D16"/>
    </linearGradient>

    <!-- Deep Maroon Gradient -->
    <linearGradient id="stk-maroon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#552228"/>
      <stop offset="35%" stop-color="#6E2830"/>
      <stop offset="70%" stop-color="#84323B"/>
      <stop offset="100%" stop-color="#60252C"/>
    </linearGradient>

    <!-- Center Fold Highlight -->
    <linearGradient id="stk-fold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8D36A"/>
      <stop offset="100%" stop-color="#D6891E"/>
    </linearGradient>
  </defs>

  <!-- NSDL Swirl Emblem -->
  <g id="stk-emblem" transform="translate(15, 20) scale(1.05)">
    <!-- Dark Maroon Arm -->
    <path d="M 105 105 
             C 118 118, 126 138, 122 152 
             C 116 174, 92 195, 62 190 
             C 32 185, 10 156, 8 126 
             C 6 96, 22 68, 48 52 
             C 62 43, 76 42, 85 45 
             L 76 66 
             C 68 64, 56 66, 46 74 
             C 30 87, 26 112, 33 130 
             C 41 150, 62 165, 82 160 
             C 96 156, 104 142, 102 128 
             C 101 120, 96 114, 90 110 
             Z" 
          fill="url(#stk-maroon)"/>

    <!-- Golden Amber Arm -->
    <path d="M 95 95 
             C 82 82, 74 62, 78 48 
             C 84 26, 108 5, 138 10 
             C 168 15, 190 44, 192 74 
             C 194 104, 178 132, 152 148 
             C 138 157, 124 158, 115 155 
             L 124 134 
             C 132 136, 144 134, 154 126 
             C 170 113, 174 88, 167 70 
             C 159 50, 138 35, 118 40 
             C 104 44, 96 58, 98 72 
             C 99 80, 104 86, 110 90 
             Z" 
          fill="url(#stk-gold)"/>

    <!-- Sharp Center Interlocking Rhombus Highlight -->
    <polygon points="98,90 115,74 108,102 91,118" fill="url(#stk-fold)"/>
    <polygon points="102,110 85,126 92,98 109,82" fill="#5A2228" opacity="0.85"/>
  </g>

  <!-- Typography Block Exactly Matching NSDL Logo.png with Wide ViewBox -->
  <g transform="translate(255, 20)">
    <!-- Line 1: NSDL (Classic High-Contrast Serif in Maroon #801824) -->
    <text x="0" y="100" font-family="'Playfair Display', 'Bodoni MT', 'Georgia', 'Times New Roman', serif" font-size="124" font-weight="900" fill="#801824" letter-spacing="2">NSDL</text>

    <!-- Line 2: Payments Bank (Bold Heavy Sans-Serif in Maroon #801824) -->
    <text x="2" y="198" font-family="'Arial Black', 'Impact', 'Franklin Gothic Heavy', 'Trebuchet MS', 'Segoe UI', sans-serif" font-size="92" font-weight="900" fill="#801824" letter-spacing="-1">Payments Bank</text>
  </g>
</svg>
